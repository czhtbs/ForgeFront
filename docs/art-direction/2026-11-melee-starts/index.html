<h1>近战与开局修正</h1><h2>基础挥剑 · 循环动画</h2><p>复用当前战斗与 MapScene 士兵绘制逻辑离线导出。建筑正常扣血，普通剑击没有黄色弹丸着弹点。</p><img src="melee-building.gif" alt="近战挥剑攻击建筑循环动画">
<h2>统一军队图标</h2><p>使用武器画像，不再用大字覆盖人物。</p><img src="army-icons.png" alt="步枪和持剑军队图标">
<h2>对手数量</h2><p>可选 1、2、3、4、5 名 AI；截图示例选中 5 名。</p><img src="../2026-11-ui-refinement/menu-review.png" alt="可选择五名 AI 的对局菜单">
<h2>内陆出生点</h2><p>80 地块、5 名 AI、种子 4521。圆点为总部；各方保留相邻金矿，并使用不同颜色。标注仅用于本预览。</p><img src="spawn-80.png" alt="六个阵营的内陆出生点">
